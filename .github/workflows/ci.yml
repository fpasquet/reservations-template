name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Format, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  database:
    name: Database migrations and seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reservations
          POSTGRES_PASSWORD: reservations
          POSTGRES_DB: reservations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservations -d reservations"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://reservations:reservations@localhost:5432/reservations
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter @reservations/api db:migrate
      - name: Apply migrations again without changes
        run: pnpm --filter @reservations/api db:migrate
      - name: Load the sample data
        run: pnpm --filter @reservations/api db:seed
